name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 빌드 및 ECR 푸시만 수행합니다.
  build-and-push:
    runs-on: intellisia-runner 
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: intellisia-main-app
        run: |
          docker build -t $ECR_REGISTRY/$REPO_NAME:${{ github.sha }} .
          docker push $ECR_REGISTRY/$REPO_NAME:${{ github.sha }}
          docker tag $ECR_REGISTRY/$REPO_NAME:${{ github.sha }} $ECR_REGISTRY/$REPO_NAME:latest
          docker push $ECR_REGISTRY/$REPO_NAME:latest