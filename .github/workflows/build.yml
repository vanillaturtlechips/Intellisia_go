name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. 빌드 및 푸시 작업
  build-and-push:
    runs-on: intellisia-runner 
    steps:
      - uses: actions/checkout@v4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: intellisia-main-app
        run: |
          docker build -t $ECR_REGISTRY/$REPO_NAME:${{ github.sha }} .
          docker push $ECR_REGISTRY/$REPO_NAME:${{ github.sha }}
          docker tag $ECR_REGISTRY/$REPO_NAME:${{ github.sha }} $ECR_REGISTRY/$REPO_NAME:latest
          docker push $ECR_REGISTRY/$REPO_NAME:latest

  # 2. 배포 작업 (빌드가 성공해야만 실행됨)
  deploy:
    runs-on: intellisia-runner # 배포도 우리 일꾼이 수행
    needs: build-and-push 
    steps:
      - name: SSH into EC2 and run Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 745173969277.dkr.ecr.ap-northeast-2.amazonaws.com
            
            docker pull 745173969277.dkr.ecr.ap-northeast-2.amazonaws.com/intellisia-main-app:latest
            docker stop my-container || true
            docker rm my-container || true
            
            # 여기서 -e DATABASE_URL 등은 GitHub Secrets에서 가져옴
            docker run -d \
              --name my-container \
              -p 3000:3000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              745173969277.dkr.ecr.ap-northeast-2.amazonaws.com/intellisia-main-app:latest